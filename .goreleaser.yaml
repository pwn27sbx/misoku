# GoReleaser config: https://goreleaser.com
#
# One download per platform:
#   misoku-macos.tar.gz    universal binary (Intel + Apple Silicon)
#   misoku-linux.tar.gz    x86-64, static: runs on every distribution
#   misoku-linux-arm64.tar.gz  arm64 (Raspberry Pi, ARM servers), static too
#   misoku-windows.zip     x64 (also runs on Windows on ARM via emulation)
version: 2

project_name: misoku

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: misoku
    main: ./cmd/misoku
    binary: misoku
    env:
      # Pure Go and statically linked: no system libraries needed.
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

universal_binaries:
  - id: misoku
    replace: true

archives:
  - id: misoku
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Version-free names so https://github.com/…/releases/latest/download/…
    # always points at the newest build.
    name_template: >-
      {{ .ProjectName }}-{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}{{ if and (eq .Os "linux") (eq .Arch "arm64") }}-arm64{{ end }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

# Package managers. Each one publishes only when its secret is set; without
# it the package file is still generated in dist/ but nothing is pushed, so a
# release works exactly as before.

# Arch Linux (and Omarchy): yay -S misoku-bin
aurs:
  - name: misoku-bin
    ids: [misoku]
    homepage: https://github.com/pwn27sbx/misoku
    description: Block-based Markdown notebook for your terminal
    maintainers:
      - pwn27sbx
    license: MIT
    provides: [misoku]
    conflicts: [misoku]
    # Key contents of an SSH key registered on the AUR account (no passphrase).
    private_key: '{{ envOrDefault "AUR_KEY" "" }}'
    git_url: ssh://aur@aur.archlinux.org/misoku-bin.git
    skip_upload: '{{ if envOrDefault "AUR_KEY" "" }}false{{ else }}true{{ end }}'
    package: |-
      install -Dm755 "./misoku" "${pkgdir}/usr/bin/misoku"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/misoku-bin/LICENSE"
    commit_msg_template: "Update to {{ .Tag }}"

# macOS: brew install --cask pwn27sbx/tap/misoku
homebrew_casks:
  - name: misoku
    ids: [misoku]
    binaries: [misoku]
    homepage: https://github.com/pwn27sbx/misoku
    description: Block-based Markdown notebook for your terminal
    license: MIT
    repository:
      owner: pwn27sbx
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    skip_upload: '{{ if envOrDefault "HOMEBREW_TAP_TOKEN" "" }}false{{ else }}true{{ end }}'
    commit_msg_template: "misoku {{ .Tag }}"
    # The binary is not notarized: without this, macOS refuses to open a
    # quarantined download. This is the hook GoReleaser documents for casks.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/misoku"]
          end

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  header: |
    ## Install

    **macOS / Linux**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/pwn27sbx/misoku/main/install.sh | sh
    ```

    **Windows (PowerShell)**
    ```powershell
    irm https://raw.githubusercontent.com/pwn27sbx/misoku/main/install.ps1 | iex
    ```

    Or download the file for your system below and put `misoku` on your `PATH`.

# The notes are the install header above, not a commit list.
changelog:
  disable: true
