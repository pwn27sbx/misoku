# GoReleaser config: https://goreleaser.com
#
# One download per platform:
#   misoku-macos.tar.gz    universal binary (Intel + Apple Silicon)
#   misoku-linux.tar.gz    x86-64, static: runs on every distribution
#   misoku-windows.zip     x64 (also runs on Windows on ARM via emulation)
version: 2

project_name: misoku

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: misoku
    main: ./cmd/misoku
    binary: misoku
    env:
      # Pure Go and statically linked: no system libraries needed.
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: linux
        goarch: arm64
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

universal_binaries:
  - id: misoku
    replace: true

archives:
  - id: misoku
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Version-free names so https://github.com/…/releases/latest/download/…
    # always points at the newest build.
    name_template: >-
      {{ .ProjectName }}-{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  header: |
    ## Install

    **macOS / Linux**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/pwn27sbx/misoku/main/install.sh | sh
    ```

    **Windows (PowerShell)**
    ```powershell
    irm https://raw.githubusercontent.com/pwn27sbx/misoku/main/install.ps1 | iex
    ```

    Or download the file for your system below and put `misoku` on your `PATH`.

# The notes are the install header above, not a commit list.
changelog:
  disable: true
