# GoReleaser config: https://goreleaser.com
#
# One download per platform:
#   misoku-macos.tar.gz    universal binary (Intel + Apple Silicon)
#   misoku-linux.tar.gz    x86-64, static: runs on every distribution
#   misoku-linux-arm64.tar.gz  arm64 (Raspberry Pi, ARM servers), static too
#   misoku-windows.zip     x64 (also runs on Windows on ARM via emulation)
version: 2

project_name: misoku

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: misoku
    main: ./cmd/misoku
    binary: misoku
    env:
      # Pure Go and statically linked: no system libraries needed.
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

universal_binaries:
  - id: misoku
    replace: true

archives:
  - id: misoku
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Version-free names so https://github.com/…/releases/latest/download/…
    # always points at the newest build.
    name_template: >-
      {{ .ProjectName }}-{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}{{ if and (eq .Os "linux") (eq .Arch "arm64") }}-arm64{{ end }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

# Package managers. Each one publishes only when its secret is set (and the
# AUR one also needs AUR_PUBLISH=true); otherwise the package file is still
# generated in dist/ but nothing is pushed, so a release works exactly as before.
#
# skip_upload is resolved before the publish step reads private_key, so a
# missing key never reaches the git client. url and private_key go through
# the full template engine (not the {{ .Env.VAR }}-only one used for tokens),
# which is why envOrDefault works there.

# Arch Linux (and Omarchy): yay -S misoku-bin
aurs:
  - name: misoku-bin
    ids: [misoku]
    homepage: https://github.com/pwn27sbx/misoku
    description: Block-based Markdown notebook for your terminal
    maintainers:
      - pwn27sbx
    license: MIT
    provides: [misoku]
    conflicts: [misoku]
    # Key contents of an SSH key registered on the AUR account (no passphrase).
    private_key: '{{ envOrDefault "AUR_KEY" "" }}'
    git_url: ssh://aur@aur.archlinux.org/misoku-bin.git
    # Off unless AUR_PUBLISH is "true" and AUR_KEY is set: the key alone is
    # not enough while no AUR account accepts it.
    skip_upload: '{{ if and (eq (envOrDefault "AUR_PUBLISH" "") "true") (isEnvSet "AUR_KEY") }}false{{ else }}true{{ end }}'
    package: |-
      install -Dm755 "./misoku" "${pkgdir}/usr/bin/misoku"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/misoku-bin/LICENSE"
    commit_msg_template: "Update to {{ .Tag }}"

# macOS: brew install --cask pwn27sbx/tap/misoku
homebrew_casks:
  - name: misoku
    ids: [misoku]
    binaries: [misoku]
    homepage: https://github.com/pwn27sbx/misoku
    description: Block-based Markdown notebook for your terminal
    license: MIT
    # Pushed over SSH with a deploy key that has write access to the tap.
    repository:
      owner: pwn27sbx
      name: homebrew-tap
      git:
        url: git@github.com:pwn27sbx/homebrew-tap.git
        private_key: '{{ envOrDefault "HOMEBREW_TAP_KEY" "" }}'
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_KEY" }}false{{ else }}true{{ end }}'
    commit_msg_template: "misoku {{ .Tag }}"
    # The binary is not notarized: without this, macOS refuses to open a
    # quarantined download. This is the hook GoReleaser documents for casks.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/misoku"]
          end

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  header: |
    ## Install

    **macOS / Linux**
    ```sh
    curl -fsSL https://raw.githubusercontent.com/pwn27sbx/misoku/main/install.sh | sh
    ```

    **Windows (PowerShell)**
    ```powershell
    irm https://raw.githubusercontent.com/pwn27sbx/misoku/main/install.ps1 | iex
    ```

    Or download the file for your system below and put `misoku` on your `PATH`.

# The notes are the install header above, not a commit list.
changelog:
  disable: true
