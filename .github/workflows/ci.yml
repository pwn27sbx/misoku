name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # The tests start thousands of git processes in temporary folders, and
      # Defender scans every one of them. Best effort: if the runner does not
      # allow it, the tests still run, only slower.
      - name: Keep Defender out of the temporary folder
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:RUNNER_TEMP -ErrorAction Stop
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV

      # 20 minutes per package instead of go test's 10: a safety net for the
      # slow Windows runner, not a budget to grow into.
      - name: Test
        run: go test -timeout 20m ./...

      - name: Build
        run: go build ./cmd/misoku

  # Build the Nix flake so a stale vendorHash or version fails here, not for
  # users running `nix run github:pwn27sbx/misoku`.
  nix:
    name: Nix build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned: Nix's installer depends on the runner image, and
        # ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19
        # (actions/runner-images#14748).
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Check for flake
        id: flake
        run: |
          if [ -f flake.nix ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No flake.nix; skipping."
          fi

      - uses: cachix/install-nix-action@v31
        if: steps.flake.outputs.present == 'true'

      - name: Build
        if: steps.flake.outputs.present == 'true'
        run: nix build -L .#default

      - name: Run
        if: steps.flake.outputs.present == 'true'
        run: ./result/bin/misoku --version

  # Build the full release locally and install it on every platform the
  # installers and packages target.
  snapshot:
    name: Snapshot release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=before
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  install-macos:
    name: Install (macOS)
    needs: snapshot
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Install script
        run: sh ./.github/scripts/install-test.sh
      # Offline: fake releases of Misoku and gh as file:// URLs
      # (MISOKU_BASE_URL, MISOKU_GH_BASE_URL). gh installed and marked, a
      # gh that is not ours left alone, bad checksums abort, the PATH line
      # added once, macOS and Linux (x86-64 and arm64) simulated.
      - name: Installer checks (offline)
        run: sh scripts/test-install.sh

  install-checks-linux:
    name: Installer checks (Linux, offline)
    # Pinned: shellcheck comes from the runner image (see the nix job).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck install.sh scripts/test-install.sh
      - name: Installer checks (offline)
        run: sh scripts/test-install.sh

  install-linux:
    name: Install (${{ matrix.image }})
    needs: snapshot
    # Pinned: the containers run on the runner's Docker (see the nix job).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:24.04", setup: "apt-get update && apt-get install -y python3 curl" }
          - { image: "debian:stable-slim", setup: "apt-get update && apt-get install -y python3 wget" }
          - { image: "fedora:latest", setup: "dnf install -y python3 tar gzip" }
          - { image: "alpine:latest", setup: "apk add --no-cache python3" }
          - { image: "archlinux:latest", setup: "pacman -Sy --noconfirm python" }
          - { image: "opensuse/tumbleweed", setup: "zypper -n install python3 curl tar gzip" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Install script
        run: |
          docker run --rm -v "$PWD:/w" -w /w "${{ matrix.image }}" sh -c '
            set -e
            ${{ matrix.setup }}
            sh ./.github/scripts/install-test.sh
          '

  install-windows:
    name: Install (Windows)
    needs: snapshot
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Install script
        shell: pwsh
        run: |
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', 'dist' -PassThru
          $up = $false
          foreach ($i in 1..30) {
            try { Invoke-WebRequest 'http://127.0.0.1:8765/checksums.txt' -UseBasicParsing -TimeoutSec 2 | Out-Null; $up = $true; break } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $up) { throw 'test server did not start' }
          $env:MISOKU_BASE_URL = 'http://127.0.0.1:8765'
          $env:MISOKU_INSTALL_DIR = "$PWD\bin"
          ./install.ps1
          & "$PWD\bin\misoku.exe" --version
          Stop-Process $server
      # The harness builds its fake misoku.exe and gh.exe with Go.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      # Offline: fake releases of Misoku and gh as file:// URLs
      # (MISOKU_BASE_URL, MISOKU_GH_BASE_URL). gh installed and marked, a gh
      # that is not ours left alone, ours updated, bad checksums abort with
      # nothing installed, MISOKU_GH_SHA256 ignored over the network, git
      # through winget, and `irm | iex`; under PowerShell 7 and 5.1.
      - name: Installer checks (offline, PowerShell 7)
        shell: pwsh
        run: ./scripts/test-install.ps1 -Shell pwsh
      - name: Installer checks (offline, Windows PowerShell 5.1)
        shell: pwsh
        run: ./scripts/test-install.ps1 -Shell powershell
