name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # The release gate reads the CI runs of the tagged commit.
  actions: read

jobs:
  # A tag does not start CI: the tagged commit's run came from its push to
  # main. Refuse to publish when that run is red, still going or missing.
  ci-green:
    name: Require green CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Require green CI for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/require-green-ci.sh "${{ github.repository }}" "${{ github.sha }}"

  goreleaser:
    name: GoReleaser
    needs: ci-green
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: when a secret is missing, its package is not published
          # and the release goes ahead as before (see .goreleaser.yaml).
          HOMEBREW_TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          # The AUR package is pushed only when this repo variable is "true".
          AUR_PUBLISH: ${{ vars.AUR_PUBLISH }}
